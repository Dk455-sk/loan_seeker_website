 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loan Application Submitted</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-lg p-4 border-0" style="max-width: 600px; width: 100%;">
      <div class="text-center">
        <div class="alert alert-success d-flex align-items-center justify-content-center" role="alert">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" class="bi bi-check-circle-fill me-2" viewBox="0 0 16 16">
            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM6.97 11.03a.75.75 0 0 0 1.08.02l3.992-4.99a.75.75 0 1 0-1.144-.976L7.525 9.384 5.97 7.97a.75.75 0 0 0-1.08 1.04l2.08 2.02z"/>
          </svg>
          <strong>Success!</strong>
        </div>
        <h2 class="mb-3">Thank you, <span class="text-primary">{{ name }}</span>!</h2>
        <p class="lead">Your loan application has been successfully submitted. We will review your information and get back to you shortly.</p>
        <hr>
        <a href="{% url 'home' %}" class="btn btn-success mt-3">Go to Dashboard</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
